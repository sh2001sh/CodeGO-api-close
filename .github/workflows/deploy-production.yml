name: Deploy verified CodeGo V3 images

on:
  workflow_dispatch:
    inputs:
      revision:
        description: 'Exact 40-character commit with a successful V3 verification and published images'
        required: true
        type: string
      compose_file:
        description: 'Existing V3 JSON Compose filename in PRODUCTION_DEPLOY_PATH'
        required: true
        default: compose.json
        type: string

concurrency:
  group: codego-v3-production
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Require a verified immutable revision
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          [[ "$REVISION" =~ ^[0-9a-f]{40}$ ]]
          gh api --method GET "repos/$GH_REPO/actions/workflows/v3-verify.yml/runs" \
            -f head_sha="$REVISION" -f status=completed -f event=push -f per_page=100 \
            | jq -e '.workflow_runs | any(.head_sha == env.REVISION and .conclusion == "success")' >/dev/null
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision }}
      - name: Validate deployment configuration
        env:
          DEPLOY_HOST: ${{ secrets.PRODUCTION_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.PRODUCTION_DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.PRODUCTION_DEPLOY_PATH }}
          DEPLOY_SSH_KEY: ${{ secrets.PRODUCTION_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.PRODUCTION_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for key in DEPLOY_HOST DEPLOY_USER DEPLOY_PATH DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
            if [ -z "${!key:-}" ]; then echo "Missing deployment configuration: $key" >&2; exit 1; fi
          done
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/codego-v3-production"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/codego-v3-production" "$HOME/.ssh/known_hosts"
      - name: Update existing V3 runtime without resetting configuration
        env:
          DEPLOY_HOST: ${{ secrets.PRODUCTION_DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.PRODUCTION_DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.PRODUCTION_DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.PRODUCTION_DEPLOY_PATH }}
          DEPLOY_COMMIT_SHA: ${{ inputs.revision }}
          DEPLOY_COMPOSE_FILE: ${{ inputs.compose_file }}
        run: |
          set -euo pipefail
          printf -v q_path '%q' "$DEPLOY_PATH"
          printf -v q_revision '%q' "$DEPLOY_COMMIT_SHA"
          printf -v q_compose '%q' "$DEPLOY_COMPOSE_FILE"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -i "$HOME/.ssh/codego-v3-production" -p "${DEPLOY_PORT:-22}" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_PATH=$q_path DEPLOY_COMMIT_SHA=$q_revision DEPLOY_COMPOSE_FILE=$q_compose python3 -" \
            < .github/scripts/deploy-v3-existing.py
      - name: Verify public application
        env:
          PUBLIC_URL: ${{ secrets.PRODUCTION_PUBLIC_BASE_URL }}
        run: |
          set -euo pipefail
          base_url="${PUBLIC_URL:-https://codegoai.com}"
          curl --fail --silent --show-error --retry 5 --retry-delay 2 "${base_url%/}/api/status" \
            | jq -e '.success == true' >/dev/null
      - name: Remove temporary SSH credentials
        if: always()
        run: rm -f "$HOME/.ssh/codego-v3-production"
