name: V2 gateway compatibility hotfix

on:
  push:
    branches: [fix/v2-gateway-compat-20261016]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: v2-gateway-compat-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
      - name: Build production frontend assets
        working-directory: web/default
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Verify gateway, conversions and billing
        run: |
          go test -p 1 -timeout 3m ./internal/gateway/translation ./internal/gateway/responsesws ./internal/gateway/transport/http ./internal/gateway/execution/providers ./internal/gateway/execution/providers/openai ./internal/billing/app
          go test -race -p 1 -count=1 -timeout 3m ./internal/gateway/translation ./internal/gateway/responsesws ./internal/gateway/transport/http ./internal/gateway/execution/providers ./internal/gateway/execution/providers/openai -run 'ResponsesWebsocket|SessionCancellation|Bridge|ChatToResponses|ResponsesToChat|CustomTool'
          go build -p 1 ./cmd/gateway-api
      - name: Resolve immutable image version
        id: version
        run: |
          echo "tag=sha-${GITHUB_SHA::7}-gateway-api-amd64" >> "$GITHUB_OUTPUT"
          printf 'sha-%s\n' "${GITHUB_SHA::7}" > VERSION
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
      - name: Publish tested gateway
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: |
            APP_PATH=./cmd/gateway-api
            FRONTEND_REVISION=${{ github.sha }}
            BUN_IMAGE=mirror.gcr.io/oven/bun:1@sha256:0733e50325078969732ebe3b15ce4c4be5082f18c4ac1a0f0ca4839c2e4e42a7
            GO_IMAGE=mirror.gcr.io/library/golang:1.26.1-alpine@sha256:2389ebfa5b7f43eeafbd6be0c3700cc46690ef842ad962f6c5bd6be49ed82039
            RUNTIME_IMAGE=mirror.gcr.io/library/debian:bookworm-slim@sha256:f06537653ac770703bc45b4b113475bd402f451e85223f0f2837acbf89ab020a
          cache-from: |
            type=gha,scope=v2-usage-metrics-gateway-api-amd64
            type=gha,scope=v2-gateway-api-amd64
          cache-to: type=gha,mode=max,scope=v2-gateway-compat-amd64
          tags: ghcr.io/sh2001sh/codego-api:${{ steps.version.outputs.tag }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - name: Record published image
        env:
          IMAGE: ghcr.io/sh2001sh/codego-api:${{ steps.version.outputs.tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          printf 'Gateway image: %s@%s\n' "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
