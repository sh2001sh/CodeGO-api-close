name: CodeGo v3 verification

on:
  pull_request:
    paths:
      - 'v3/**'
      - 'web/app/**'
      - '.github/workflows/v3-verify.yml'
  push:
    paths:
      - 'v3/**'
      - 'web/app/**'
      - '.github/workflows/v3-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    # The real PG/race suite alone exceeded 30 minutes locally. Include room
    # for lint, migration checks and compilation without dropping coverage.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: v3/go.mod
          cache-dependency-path: v3/go.sum
      - name: Download modules
        working-directory: v3
        run: go mod download
      - name: Verify module boundaries, unit, lint, race and database behavior
        run: bash v3/scripts/verify.sh boundaries test lint race integration pgtest atlas
      - name: Check generation
        run: |
          bash v3/scripts/generate.sh
          git diff --exit-code -- v3/api
      - name: Build binaries
        working-directory: v3
        run: go build ./cmd/gateway ./cmd/control ./cmd/worker ./cmd/migrate

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        working-directory: web/app
        run: bun install --frozen-lockfile
      - name: Verify types, tests and asset budget
        working-directory: web/app
        run: |
          bun run typecheck
          bun run check:api
          bun run format:check
          bun run test
          bun run build
          bun run check:size
      - uses: actions/upload-artifact@v4
        with:
          name: codego-v3-web
          path: web/app/dist

  images:
    # Only a revision that passed the real isolated stack can be published.
    needs: [backend, frontend, acceptance]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [gateway, control, worker, migrate, web]
    steps:
      - uses: actions/checkout@v4
      - name: Resolve immutable revision tag
        id: image
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: echo "tag=sha-${COMMIT_SHA:0:7}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/v3-rebuild' || startsWith(github.ref, 'refs/tags/'))
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: ${{ matrix.service == 'web' && 'v3/deploy/Dockerfile.web' || 'v3/Dockerfile' }}
          build-args: SERVICE=${{ matrix.service }}
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/v3-rebuild' || startsWith(github.ref, 'refs/tags/')) }}
          tags: ghcr.io/sh2001sh/codego-api:${{ steps.image.outputs.tag }}-${{ matrix.service }}-amd64
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - name: Record verified image
        env:
          IMAGE: ghcr.io/sh2001sh/codego-api:${{ steps.image.outputs.tag }}-${{ matrix.service }}-amd64
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "Verified image: \`$IMAGE\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Digest: \`$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"

  acceptance:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      V3_REAL_URL: http://localhost:18083
      V3_REAL_PROJECT: codego-v3-ci
      V3_REAL_OIDC_CLIENT_ID: codego-v3-ci-community
      V3_REAL_OIDC_REDIRECT_URI: http://localhost:18083/community-callback
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Prepare isolated test credentials
        run: |
          python3 - <<'PY'
          import base64, os, secrets, subprocess
          values = {
              'V3_TEST_PG_PASSWORD': secrets.token_urlsafe(24),
              'V3_SECRET_KEY': base64.b64encode(secrets.token_bytes(32)).decode(),
              'V3_SESSION_SECRET': base64.b64encode(secrets.token_bytes(32)).decode(),
              'OIDC_ISSUER': os.environ['V3_REAL_URL'],
              'OIDC_CLIENT_ID': os.environ['V3_REAL_OIDC_CLIENT_ID'],
              'OIDC_CLIENT_SECRET': secrets.token_urlsafe(32),
              'OIDC_REDIRECT_URI': os.environ['V3_REAL_OIDC_REDIRECT_URI'],
              'OIDC_SIGNING_PRIVATE_KEY_BASE64': base64.b64encode(subprocess.check_output(
                  ['openssl', 'genpkey', '-algorithm', 'RSA', '-pkeyopt', 'rsa_keygen_bits:2048'],
                  stderr=subprocess.DEVNULL)).decode(),
          }
          fd = os.open('/tmp/codego-v3-ci.env', os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
          with os.fdopen(fd, 'w') as f:
              f.write(''.join(f'{key}={value}\n' for key, value in values.items()))
          PY
      - name: Build and start all services
        run: |
          docker compose --env-file /tmp/codego-v3-ci.env -f v3/deploy/compose.test.yaml -p codego-v3-ci up --build -d
          ready=0
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:18083/healthz >/dev/null; then ready=1; break; fi
            sleep 2
          done
          test "$ready" = 1
          # The Compose network is dynamic. Trust this project's exact edge,
          # rather than a broad Docker/private CIDR or caller-supplied XFF.
          edge=$(docker compose --env-file /tmp/codego-v3-ci.env -f v3/deploy/compose.test.yaml -p codego-v3-ci ps -q web)
          edge_ip=$(docker inspect --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$edge")
          test -n "$edge_ip"
          printf 'V3_TRUSTED_PROXY_CIDRS=%s/32\n' "$edge_ip" >> /tmp/codego-v3-ci.env
          docker compose --env-file /tmp/codego-v3-ci.env -f v3/deploy/compose.test.yaml -p codego-v3-ci up -d --no-deps --wait --wait-timeout 180 gateway control
          # Restart (not recreate) keeps the edge IP and refreshes backend DNS.
          docker compose --env-file /tmp/codego-v3-ci.env -f v3/deploy/compose.test.yaml -p codego-v3-ci restart web
          ready=0
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:18083/api/status >/dev/null; then ready=1; break; fi
            sleep 2
          done
          test "$ready" = 1
      - name: Verify real API, exact settlements and failure recovery
        run: python3 v3/scripts/acceptance-stack.py --project codego-v3-ci --url "$V3_REAL_URL"
      - name: Verify proxy connection reuse, compression and stream boundaries
        run: python3 v3/deploy/verify-proxy.py
      - name: Install browser tests
        working-directory: web/app
        run: |
          bun install --frozen-lockfile
          bunx playwright install --with-deps chromium
      - name: Verify mock desktop and mobile workflows
        working-directory: web/app
        run: bun run test:e2e --grep-invert "real|zz-" --workers=2
        env:
          V3_REAL_URL: ''
      - name: Verify real desktop and mobile workflows against the isolated deployment
        working-directory: web/app
        run: |
          for viewport in desktop mobile; do
            for spec in real-stack real-oidc real-restored real-subscription-v2; do
              # Each workflow retains the real 10/min authentication limit.
              # Restart only the disposable control between isolated cases.
              docker compose --env-file /tmp/codego-v3-ci.env -f ../../v3/deploy/compose.test.yaml -p "$V3_REAL_PROJECT" restart control
              ready=0
              for i in $(seq 1 30); do
                if curl -fsS "$V3_REAL_URL/api/status" >/dev/null; then ready=1; break; fi
                sleep 2
              done
              test "$ready" = 1
              bun run test:e2e "$spec.spec.ts" --project="$viewport" --workers=1 --forbid-only
            done
          done
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: codego-v3-browser-failures
          path: web/app/test-results
      - name: Show test service logs on failure
        if: failure()
        run: docker compose --env-file /tmp/codego-v3-ci.env -f v3/deploy/compose.test.yaml -p codego-v3-ci logs --tail=100 gateway control worker
      - name: Stop isolated test services
        if: always()
        run: |
          docker compose --env-file /tmp/codego-v3-ci.env -f v3/deploy/compose.test.yaml -p codego-v3-ci down --volumes
          rm -f /tmp/codego-v3-ci.env
