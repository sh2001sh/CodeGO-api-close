# V3 image-only template for a NEW deployment using external PostgreSQL/Redis.
# Existing production deployments retain their own ports, volumes and networks.
x-backend: &backend
  restart: unless-stopped
  stop_grace_period: 60s
  environment: &environment
    V3_PG_DSN: ${V3_PG_DSN:?set the existing PostgreSQL DSN}
    V3_REDIS_ADDR: ${V3_REDIS_ADDR:?set the existing Redis address}
    V3_REDIS_PASSWORD: ${V3_REDIS_PASSWORD:-}
    V3_SECRET_KEY: ${V3_SECRET_KEY:?set the existing encryption key}
    V3_SESSION_SECRET: ${V3_SESSION_SECRET:?set the existing session signing key}
    V3_PUBLIC_URL: ${V3_PUBLIC_URL:?set the public HTTPS origin}
    V3_INTERNAL_GATEWAY_URL: http://gateway:3001
    V3_TRUSTED_PROXY_CIDRS: ${V3_TRUSTED_PROXY_CIDRS:-}
    V3_BILLING_WAL_DIR: /data/wal
    V3_FILES_DIR: /data/files
    V3_LOG_DIR: /data/logs

services:
  migrate:
    <<: *backend
    image: ${V3_IMAGE_REPOSITORY:-ghcr.io/sh2001sh/codego-api}:${V3_IMAGE_TAG:?set sha-COMMIT7}-migrate-amd64
    profiles: [operations]
    command: [schema]
    restart: 'no'

  worker:
    <<: *backend
    image: ${V3_IMAGE_REPOSITORY:-ghcr.io/sh2001sh/codego-api}:${V3_IMAGE_TAG:?set sha-COMMIT7}-worker-amd64
    environment:
      <<: *environment
      V3_PG_MAX_CONNS: ${V3_WORKER_PG_MAX_CONNS:-6}
      V3_LEDGER_CONSUMERS: ${V3_LEDGER_CONSUMERS:-2}
      V3_LEDGER_BATCH_SIZE: ${V3_LEDGER_BATCH_SIZE:-16}
      V3_AUDIT_SAMPLE_RETENTION_DAYS: ${V3_AUDIT_SAMPLE_RETENTION_DAYS:-30}
    volumes:
      - worker-wal:/data/wal
      - gateway-files:/data/files
      - service-logs:/data/logs
    healthcheck:
      test: [CMD-SHELL, wget -q -O /dev/null http://127.0.0.1:9102/metrics]
      interval: 10s
      timeout: 5s
      retries: 30

  gateway:
    <<: *backend
    image: ${V3_IMAGE_REPOSITORY:-ghcr.io/sh2001sh/codego-api}:${V3_IMAGE_TAG:?set sha-COMMIT7}-gateway-amd64
    command: [-addr, '0.0.0.0:3001']
    environment:
      <<: *environment
      V3_PG_MAX_CONNS: ${V3_GATEWAY_PG_MAX_CONNS:-4}
    volumes:
      - gateway-wal:/data/wal
      - gateway-files:/data/files
      - service-logs:/data/logs
    healthcheck:
      test: [CMD-SHELL, wget -q -O /dev/null http://127.0.0.1:3001/readyz]
      interval: 10s
      timeout: 5s
      retries: 30

  control:
    <<: *backend
    image: ${V3_IMAGE_REPOSITORY:-ghcr.io/sh2001sh/codego-api}:${V3_IMAGE_TAG:?set sha-COMMIT7}-control-amd64
    command: [-addr, '0.0.0.0:3000']
    environment:
      <<: *environment
      V3_PG_MAX_CONNS: ${V3_CONTROL_PG_MAX_CONNS:-3}
    volumes:
      - service-logs:/data/logs
    healthcheck:
      test: [CMD-SHELL, wget -q -O /dev/null http://127.0.0.1:3000/readyz]
      interval: 10s
      timeout: 5s
      retries: 30

  web:
    image: ${V3_IMAGE_REPOSITORY:-ghcr.io/sh2001sh/codego-api}:${V3_IMAGE_TAG:?set sha-COMMIT7}-web-amd64
    ports:
      - '127.0.0.1:${V3_WEB_PORT:-8080}:80'
    depends_on:
      gateway:
        condition: service_healthy
      control:
        condition: service_healthy
      worker:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, wget -q -O /dev/null http://127.0.0.1/healthz]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    stop_grace_period: 60s

volumes:
  worker-wal:
  gateway-wal:
  gateway-files:
  service-logs:
