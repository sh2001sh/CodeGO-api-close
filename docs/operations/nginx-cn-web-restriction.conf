# Included by /etc/nginx/sites-enabled/shu26.cfd on the web server only.
# Cloudflare is enforced by cloudflare-only.conf before this decision, so the
# country header is accepted only from a trusted Cloudflare peer.
map "$http_cf_ipcountry:$uri" $codego_cn_web_block {
    default 0;
    ~*^CN:(?!/api(?:/|$)|/v1(?:/|$)|/__codego-cn-restricted$) 1;
}

