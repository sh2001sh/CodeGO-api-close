name: codego-v3-test

x-backend: &backend
  build:
    context: ../..
    dockerfile: v3/Dockerfile
  environment: &environment
    V3_PG_DSN: postgres://codego:${V3_TEST_PG_PASSWORD:?set a test database password}@postgres:5432/codego?sslmode=disable
    V3_REDIS_ADDR: redis:6379
    V3_SECRET_KEY: ${V3_SECRET_KEY:?set a base64 encoded 32 byte key}
    V3_SESSION_SECRET: ${V3_SESSION_SECRET:?set a separate base64 session signing key}
    V3_BILLING_WAL_DIR: /data/wal
    V3_FILES_DIR: /data/files
    V3_PUBLIC_URL: http://localhost:${V3_TEST_PORT:-18083}
    V3_INTERNAL_GATEWAY_URL: http://gateway:3001
    V3_TRUSTED_PROXY_CIDRS: ${V3_TRUSTED_PROXY_CIDRS:-}
    REQUEST_ABUSE_GUARD_ENABLED: ${REQUEST_ABUSE_GUARD_ENABLED:-false}
  restart: unless-stopped
  extra_hosts:
    - host.docker.internal:host-gateway
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: codego
      POSTGRES_PASSWORD: ${V3_TEST_PG_PASSWORD:?set a test database password}
      POSTGRES_DB: codego
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U codego -d codego]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: [redis-server, --maxmemory-policy, noeviction, --appendonly, 'yes']
    volumes:
      - redis:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  migrate:
    <<: *backend
    build:
      context: ../..
      dockerfile: v3/Dockerfile
      args:
        SERVICE: migrate
    command: [schema]
    restart: 'no'

  worker:
    <<: *backend
    build:
      context: ../..
      dockerfile: v3/Dockerfile
      args:
        SERVICE: worker
    volumes:
      - worker-wal:/data/wal
      - gateway-files:/data/files
    healthcheck:
      test: [CMD-SHELL, wget -q -O /dev/null http://127.0.0.1:9102/metrics]
      interval: 5s
      timeout: 3s
      retries: 30
    depends_on:
      migrate:
        condition: service_completed_successfully

  gateway:
    <<: *backend
    build:
      context: ../..
      dockerfile: v3/Dockerfile
      args:
        SERVICE: gateway
    command: [-addr, '0.0.0.0:3001']
    volumes:
      - gateway-wal:/data/wal
      - gateway-files:/data/files
    healthcheck:
      test: [CMD-SHELL, wget -q -O /dev/null http://127.0.0.1:3001/readyz]
      interval: 5s
      timeout: 3s
      retries: 30
    depends_on:
      migrate:
        condition: service_completed_successfully

  control:
    <<: *backend
    build:
      context: ../..
      dockerfile: v3/Dockerfile
      args:
        SERVICE: control
    command: [-addr, '0.0.0.0:3000']
    environment:
      <<: *environment
      V3_PUBLIC_URL: http://localhost:${V3_TEST_PORT:-18083}
      CODEGO_COMMUNITY_API_SECRET: ${CODEGO_COMMUNITY_API_SECRET:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
      OIDC_SIGNING_PRIVATE_KEY_BASE64: ${OIDC_SIGNING_PRIVATE_KEY_BASE64:-}
    healthcheck:
      test: [CMD-SHELL, wget -q -O /dev/null http://127.0.0.1:3000/readyz]
      interval: 5s
      timeout: 3s
      retries: 30
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: ../..
      dockerfile: v3/deploy/Dockerfile.web
    ports:
      - '127.0.0.1:${V3_TEST_PORT:-18083}:80'
    depends_on:
      gateway:
        condition: service_healthy
      control:
        condition: service_healthy
      worker:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, wget -q -O /dev/null http://127.0.0.1/healthz]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

volumes:
  postgres:
  redis:
  worker-wal:
  gateway-wal:
  gateway-files:

