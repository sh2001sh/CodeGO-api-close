map $http_accept_encoding $codego_br {
    default 0;
    "~*(^|,)\s*br\s*;\s*q=0(\.0*)?\s*(,|$)" 0;
    "~*(^|,)\s*br\s*(;\s*q=(0\.\d+|1(\.0*)?))?\s*(,|$)" 1;
    "~*(^|,)\s*\*\s*(;\s*q=(0\.\d*[1-9]\d*|1(\.0*)?))?\s*(,|$)" 1;
}
map $http_accept_encoding $codego_gzip {
    default 0;
    "~*(^|,)\s*gzip\s*;\s*q=0(\.0*)?\s*(,|$)" 0;
    "~*(^|,)\s*gzip\s*(;\s*q=(0\.\d+|1(\.0*)?))?\s*(,|$)" 1;
    "~*(^|,)\s*\*\s*(;\s*q=(0\.\d*[1-9]\d*|1(\.0*)?))?\s*(,|$)" 1;
}
map "$codego_br:$codego_gzip" $codego_encoding {
    default '';
    ~^1: br;
    ~:1$ gzip;
}
map $codego_encoding $codego_suffix {
    default '';
    br .br;
    gzip .gz;
}
map $http_upgrade $codego_connection {
    default upgrade;
    '' '';
}

upstream codego_v3_gateway {
    server gateway:3001;
    keepalive 256;
    keepalive_requests 10000;
    keepalive_timeout 60s;
}
upstream codego_v3_control {
    server control:3000;
    keepalive 64;
    keepalive_requests 10000;
    keepalive_timeout 60s;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 32m;

    # Compress control JSON only. Model and notification streams must flush
    # immediately and are explicitly excluded below.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/json;

    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Replace caller-supplied forwarding headers at this direct test edge.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }
    location /api/ {
        proxy_pass http://codego_v3_control;
    }
    location = /api/notifications/events {
        proxy_pass http://codego_v3_control;
        gzip off;
        proxy_buffering off;
        proxy_read_timeout 1800s;
    }
    location /.well-known/ {
        proxy_pass http://codego_v3_control;
    }
    location ~ ^/(v1/|v1beta/|v1alpha/|dashboard/billing/) {
        proxy_pass http://codego_v3_gateway;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $codego_connection;
        gzip off;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1800s;
    }
    location ~* \.(?:js|mjs)$ {
        default_type application/javascript;
        try_files $uri$codego_suffix =404;
        add_header Content-Encoding $codego_encoding;
        add_header Vary Accept-Encoding;
        add_header Cache-Control 'public, max-age=31536000, immutable';
    }
    location ~* \.css$ {
        default_type text/css;
        try_files $uri$codego_suffix =404;
        add_header Content-Encoding $codego_encoding;
        add_header Vary Accept-Encoding;
        add_header Cache-Control 'public, max-age=31536000, immutable';
    }
    location ~* \.(?:woff2?|png|jpe?g|svg|webp|ico)$ {
        try_files $uri =404;
        add_header Cache-Control 'public, max-age=31536000, immutable';
    }
    location = /index.html {
        add_header Cache-Control 'no-cache';
    }
    location / {
        try_files $uri /index.html;
        add_header Cache-Control 'no-cache';
    }
}
